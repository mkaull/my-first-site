<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MacroPulse | Instant Nutrition Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0B0F17;
      --bg-card: #131B2A;
      --bg-card-hover: #1A2438;
      --bg-inset: #080C13;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-emerald: rgba(16, 185, 129, 0.3);
      
      --accent-emerald: #10B981;
      --accent-emerald-bright: #34D399;
      --accent-emerald-glow: rgba(16, 185, 129, 0.35);
      
      --accent-carbs: #3B82F6;
      --accent-carbs-glow: rgba(59, 130, 246, 0.25);
      
      --accent-fat: #F59E0B;
      --accent-fat-glow: rgba(245, 158, 11, 0.25);

      --accent-water: #06B6D4;
      
      --text-main: #F9FAFB;
      --text-sub: #9CA3AF;
      --text-muted: #6B7280;
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;

      --spring-transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 65%),
        radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 40px;
    }

    /* Multi-column grid for tablet & desktop to fill screen */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .column-left, .column-right {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header & Interactive User Profile Bar */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pulse-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-emerald), #059669);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-emerald-glow);
    }

    .pulse-logo svg {
      width: 22px;
      height: 22px;
      fill: #000;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Interactive User Badge with Modal Trigger */
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-emerald);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--spring-transition);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .user-badge:hover {
      background: rgba(16, 185, 129, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-emerald-glow);
    }

    .user-badge:active {
      transform: scale(0.96);
    }

    .user-avatar {
      width: 26px;
      height: 26px;
      background: var(--accent-emerald-bright);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 0.8rem;
    }

    .user-badge .edit-hint {
      font-size: 0.65rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      color: var(--accent-emerald-bright);
    }

    /* Streak & Hydration Widgets */
    .quick-stats-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-widget-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: var(--spring-transition);
    }

    .stat-widget-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .widget-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .widget-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .widget-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .widget-action-btn {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-water);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--spring-transition);
    }

    .widget-action-btn:active {
      transform: scale(0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 65%),
        radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    /* Header & User Profile Bar */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-emerald), #059669);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-emerald-glow);
    }

    .pulse-logo svg {
      width: 20px;
      height: 20px;
      fill: #000;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-light);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .user-avatar {
      width: 20px;
      height: 20px;
      background: #10B981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 0.7rem;
    }

    /* Goal Switcher Controls */
    .goal-selector-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .goal-switcher {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-inset);
      border-radius: var(--radius-md);
      padding: 4px;
      position: relative;
      gap: 4px;
    }

    .goal-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 10px 0;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--spring-transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 1;
      position: relative;
    }

    .goal-btn.active {
      color: #000;
      background: linear-gradient(135deg, var(--accent-emerald-bright), var(--accent-emerald));
      box-shadow: 0 4px 15px var(--accent-emerald-glow);
    }

    .goal-btn span.sub {
      font-size: 0.65rem;
      font-weight: 600;
      opacity: 0.8;
    }

    /* Dynamic Dashboard Card */
    .dashboard-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    .dashboard-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-emerald), transparent);
    }

    .dashboard-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* Circular SVG Ring */
    .ring-container {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 10;
    }

    .ring-progress {
      stroke: var(--accent-emerald);
      stroke-width: 10;
      stroke-dasharray: 326.7; /* 2 * PI * 52 */
      stroke-dashoffset: 326.7;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 6px var(--accent-emerald));
    }

    .ring-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ring-val {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .ring-lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Calories & Goal Remaining Box */
    .cal-summary {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .target-badge {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-emerald-bright);
      border: 1px solid var(--border-emerald);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .remaining-cal {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .remaining-cal .unit {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .cal-subtext {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      gap: 12px;
    }

    .cal-subtext strong {
      color: var(--text-main);
    }

    /* Macro Progress Bars */
    .macros-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .macro-bar-card {
      background: var(--bg-inset);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .macro-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .macro-title {
      color: var(--text-sub);
    }

    .macro-rem {
      font-size: 0.75rem;
      font-weight: 800;
    }

    .macro-p .macro-rem { color: var(--accent-emerald-bright); }
    .macro-c .macro-rem { color: var(--accent-carbs); }
    .macro-f .macro-rem { color: var(--accent-fat); }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .macro-p .progress-fill {
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald-glow);
    }
    .macro-c .progress-fill {
      background: var(--accent-carbs);
      box-shadow: 0 0 8px var(--accent-carbs-glow);
    }
    .macro-f .progress-fill {
      background: var(--accent-fat);
      box-shadow: 0 0 8px var(--accent-fat-glow);
    }

    .macro-details {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Quick Log Section */
    .section-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quick-tag {
      font-size: 0.65rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald-bright);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .preset-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      transition: var(--spring-transition);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      text-align: left;
    }

    .preset-card:hover, .preset-card:active {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .preset-card:active {
      transform: scale(0.97);
    }

    .preset-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .preset-icon {
      font-size: 1.3rem;
    }

    .preset-cal {
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      color: var(--accent-emerald-bright);
    }

    .preset-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .preset-macros {
      font-size: 0.7rem;
      color: var(--text-sub);
      display: flex;
      gap: 8px;
      font-weight: 600;
    }

    .preset-tap-hint {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      color: var(--accent-emerald-bright);
      font-weight: 700;
      margin-top: 2px;
    }

    /* Action Row (Custom Add + Quick Boosters) */
    .quick-actions-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--spring-transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:active {
      transform: scale(0.97);
      background: var(--bg-card-hover);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-emerald-bright), var(--accent-emerald));
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--spring-transition);
      box-shadow: 0 4px 16px var(--accent-emerald-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    /* Interactive Log Cards Section */
    .log-container {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: #EF4444;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .log-item {
      background: var(--bg-inset);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      transition: var(--spring-transition);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .log-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .log-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .log-meta {
      font-size: 0.7rem;
      color: var(--text-sub);
      display: flex;
      gap: 8px;
    }

    .log-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .log-cal {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-emerald-bright);
    }

    .del-btn {
      background: rgba(239, 68, 68, 0.1);
      border: none;
      color: #EF4444;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .del-btn:hover {
      background: #EF4444;
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Modal Overlay for Quick Custom Add */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .input-field {
      background: var(--bg-inset);
      border: 1px solid var(--border-light);
    <!-- Goal Switcher Controls -->
    <section class="goal-selector-card">
      <div class="goal-switcher">
        <button class="goal-btn active" onclick="setGoal('cut')" id="btn-cut">
          CUT
          <span class="sub">Fat Loss</span>
        </button>
        <button class="goal-btn" onclick="setGoal('recomp')" id="btn-recomp">
          RECOMP
          <span class="sub">Maintain</span>
        </button>
        <button class="goal-btn" onclick="setGoal('bulk')" id="btn-bulk">
          BULK
          <span class="sub">Muscle Gain</span>
        </button>
      </div>
    </section>

    <!-- Full-Width Responsive Dashboard Layout -->
    <div class="dashboard-grid">
      
      <!-- Left Column: Summary Dashboard & Quick Log Presets -->
      <div class="column-left">
        
        <!-- Summary Ring Dashboard -->
        <section class="dashboard-card">
          <div class="dashboard-main">
            <div class="ring-container">
              <svg class="ring-svg" viewBox="0 0 120 120">
                <circle class="ring-bg" cx="60" cy="60" r="52" fill="none"/>
                <circle class="ring-progress" id="cal-ring" cx="60" cy="60" r="52" fill="none"/>
              </svg>
              <div class="ring-content">
                <div class="ring-val" id="cal-percent">0%</div>
                <div class="ring-lbl">Target</div>
              </div>
            </div>

            <div class="cal-summary">
              <div class="target-badge" id="goal-badge">CUT MODE • 2,000 KCAL</div>
              <div class="remaining-cal">
                <span id="cal-remaining">2,000</span>
                <span class="unit">kcal left</span>
              </div>
              <div class="cal-subtext">
                <span>Eaten: <strong id="cal-consumed">0</strong></span>
                <span>Target: <strong id="cal-target">2000</strong></span>
              </div>
            </div>
          </div>

          <!-- Macro Breakdown Bars -->
          <div class="macros-grid">
            <!-- Protein -->
            <div class="macro-bar-card macro-p">
              <div class="macro-header">
                <span class="macro-title">PROTEIN</span>
                <span class="macro-rem" id="p-rem">180g left</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="p-bar"></div>
              </div>
              <div class="macro-details">
                <span id="p-eaten">0g</span>
                <span id="p-target">180g</span>
              </div>
            </div>

            <!-- Carbs -->
            <div class="macro-bar-card macro-c">
              <div class="macro-header">
                <span class="macro-title">CARBS</span>
                <span class="macro-rem" id="c-rem">170g left</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="c-bar"></div>
              </div>
              <div class="macro-details">
                <span id="c-eaten">0g</span>
                <span id="c-target">170g</span>
              </div>
            </div>

            <!-- Fat -->
            <div class="macro-bar-card macro-f">
              <div class="macro-header">
                <span class="macro-title">FAT</span>
                <span class="macro-rem" id="f-rem">55g left</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="f-bar"></div>
              </div>
              <div class="macro-details">
                <span id="f-eaten">0g</span>
                <span id="f-target">55g</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Hydration & Streak Interactive Widget Row -->
        <section class="quick-stats-bar">
          <div class="stat-widget-card" onclick="openProfileModal()">
            <div class="widget-info">
              <span class="widget-title">🔥 Daily Streak</span>
              <span class="widget-val" id="streak-count">14 Days</span>
            </div>
            <span style="font-size: 1.4rem;">⚡</span>
          </div>

          <div class="stat-widget-card" style="border-color: rgba(6, 182, 212, 0.25);">
            <div class="widget-info">
              <span class="widget-title">💧 Hydration</span>
              <span class="widget-val" id="water-val">1.2 / 3.0 L</span>
            </div>
            <button class="widget-action-btn" onclick="addWater(0.25, event)">+250ml</button>
          </div>
        </section>

        <!-- Quick Log Action Section -->
        <section>
          <div class="section-title-bar" style="margin-bottom: 10px;">
            <h2 class="section-title">
              Quick-Log Campus Meals
              <span class="quick-tag">1-TAP LOG</span>
            </h2>
          </div>

          <div class="presets-grid">
            <button class="preset-card" onclick="quickLog('Chicken & Rice Bowl', 650, 48, 70, 12, '🍗')">
              <div class="preset-header">
                <span class="preset-icon">🍗</span>
                <span class="preset-cal">650 kcal</span>
              </div>
              <div class="preset-name">Chicken & Rice Bowl</div>
              <div class="preset-macros">48g P • 70g C • 12g F</div>
              <div class="preset-tap-hint">⚡ + Tap to log</div>
            </button>

            <button class="preset-card" onclick="quickLog('Eggs & Avocado Toast', 420, 24, 32, 22, '🍳')">
              <div class="preset-header">
                <span class="preset-icon">🍳</span>
                <span class="preset-cal">420 kcal</span>
              </div>
              <div class="preset-name">Eggs & Avocado Toast</div>
              <div class="preset-macros">24g P • 32g C • 22g F</div>
              <div class="preset-tap-hint">⚡ + Tap to log</div>
            </button>

            <button class="preset-card" onclick="quickLog('Whey Shake + Banana', 320, 34, 38, 4, '🥛')">
              <div class="preset-header">
                <span class="preset-icon">🥛</span>
                <span class="preset-cal">320 kcal</span>
              </div>
              <div class="preset-name">Whey Shake + Banana</div>
              <div class="preset-macros">34g P • 38g C • 4g F</div>
              <div class="preset-tap-hint">⚡ + Tap to log</div>
            </button>

            <button class="preset-card" onclick="quickLog('Steak Burrito Bowl', 820, 52, 78, 28, '🌯')">
              <div class="preset-header">
                <span class="preset-icon">🌯</span>
                <span class="preset-cal">820 kcal</span>
              </div>
              <div class="preset-name">Steak Burrito Bowl</div>
              <div class="preset-macros">52g P • 78g C • 28g F</div>
              <div class="preset-tap-hint">⚡ + Tap to log</div>
            </button>
          </div>
        </section>

      </div> <!-- End Column Left -->

      <!-- Right Column: Interactive Today's Food Log & Actions -->
      <div class="column-right">
        
        <!-- Quick Macros & Custom Add Actions -->
        <section class="quick-actions-row">
          <button class="btn-secondary" onclick="quickAddProtein()">
            ⚡ +25g Protein
          </button>
          <button class="btn-primary" onclick="openModal()">
            + Custom Food Entry
          </button>
        </section>

        <!-- Interactive Food Log Cards -->
        <section class="log-container" style="flex: 1;">
          <div class="log-header">
            <h2 class="section-title">Today's Log Timeline</h2>
            <button class="clear-btn" onclick="clearLog()">Reset Day</button>
          </div>

          <div class="log-list" id="log-list" style="max-height: 480px;">
            <!-- Dynamic Log Cards Inserted Here -->
          </div>
        </section>

      </div> <!-- End Column Right -->

    </div> <!-- End Dashboard Grid -->

  </div> <!-- End App Container -->

  <!-- Modal Interactive Profile & Athlete Settings -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <h3 style="font-size: 1.1rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center;">
        Athlete Settings & Mode
        <span style="font-size: 0.8rem; color: var(--accent-emerald-bright); font-weight: 700;">⚙️ Customizer</span>
      </h3>

      <div class="input-group">
        <label>Athlete Name</label>
        <input type="text" id="user-name-input" class="input-field" value="Matthew">
      </div>

      <div class="input-group">
        <label>Training Mode / Profile</label>
        <select id="user-mode-select" class="input-field" style="background: var(--bg-inset); color: #fff;">
          <option value="Athlete Mode">Athlete Mode (High Intensity)</option>
          <option value="Hypertrophy / Lift Mode">Hypertrophy / Lift Mode</option>
          <option value="Endurance Runner Mode">Endurance Runner Mode</option>
          <option value="Study & Rest Mode">Study & Rest Mode</option>
        </select>
      </div>

      <div class="input-group">
        <label>Body Weight (lbs) — Auto-scales Protein Target</label>
        <input type="number" id="user-weight-input" class="input-field" value="175">
      </div>

      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="btn-secondary" onclick="closeProfileModal()">Cancel</button>
        <button class="btn-primary" style="flex:1;" onclick="saveProfileSettings()">Save & Recalculate</button>
      </div>
    </div>
  </div>

  <!-- Modal Custom Entry -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal-card">
      <h3 style="font-size: 1.1rem; font-weight: 800;">Log Custom Food</h3>
      
      <div class="input-group">
        <label>Food / Item Name</label>
        <input type="text" id="custom-name" class="input-field" placeholder="e.g., Greek Yogurt Bowl">
      </div>

      <div class="input-group">
        <label>Calories (kcal)</label>
        <input type="number" id="custom-cal" class="input-field" placeholder="250">
      </div>

      <div class="grid-inputs">
        <div class="input-group">
          <label>Protein (g)</label>
          <input type="number" id="custom-p" class="input-field" placeholder="20">
        </div>
        <div class="input-group">
          <label>Carbs (g)</label>
          <input type="number" id="custom-c" class="input-field" placeholder="30">
        </div>
        <div class="input-group">
          <label>Fat (g)</label>
          <input type="number" id="custom-f" class="input-field" placeholder="8">
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" style="flex:1;" onclick="saveCustomFood()">Add Entry</button>
      </div>
    </div>
  </div>

  <!-- Feedback Toast -->
  <div class="toast" id="toast">
    <span>⚡ Logged!</span>
  </div>

  <script>
    // Dynamic Athlete Presets & User Profile State
    let userProfile = {
      name: 'Matthew',
      mode: 'Athlete Mode',
      weight: 175
    };

    let waterIntake = 1.2; // Liters
    const waterGoal = 3.0;
    let streakDays = 14;

    function getGoalPresets(weightLbs) {
      // Scales protein dynamically (1.0g - 1.1g per lb bodyweight)
      const baseProtein = Math.round(weightLbs * 1.03);
      return {
        cut: {
          name: 'CUT MODE',
          calories: Math.round(weightLbs * 11.4),
          protein: baseProtein,
          carbs: Math.round(weightLbs * 0.97),
          fat: 55
        },
        recomp: {
          name: 'RECOMP MODE',
          calories: Math.round(weightLbs * 14.0),
          protein: Math.round(baseProtein * 0.98),
          carbs: Math.round(weightLbs * 1.37),
          fat: 65
        },
        bulk: {
          name: 'BULK MODE',
          calories: Math.round(weightLbs * 16.8),
          protein: Math.round(baseProtein * 1.05),
          carbs: Math.round(weightLbs * 1.88),
          fat: 75
        }
      };
    }

    // App State
    let currentGoalKey = 'cut';
    let foodLog = [];

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      // Pre-populate with one staple for immediate interactive feedback
      quickLog('Greek Yogurt & Berries', 280, 22, 34, 4, '🥣', false);
      updateProfileUI();
      updateUI();
    });

    // Profile Customizer Modal Handlers
    function openProfileModal() {
      document.getElementById('user-name-input').value = userProfile.name;
      document.getElementById('user-mode-select').value = userProfile.mode;
      document.getElementById('user-weight-input').value = userProfile.weight;
      document.getElementById('profile-modal').classList.add('active');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.remove('active');
    }

    function saveProfileSettings() {
      const name = document.getElementById('user-name-input').value.trim() || 'Athlete';
      const mode = document.getElementById('user-mode-select').value;
      const weight = parseInt(document.getElementById('user-weight-input').value) || 175;

      userProfile.name = name;
      userProfile.mode = mode;
      userProfile.weight = weight;

      updateProfileUI();
      updateUI();
      closeProfileModal();
      showToast(`Updated! targets scaled for ${weight} lbs`);
    }

    function updateProfileUI() {
      document.getElementById('user-display-name').innerText = `${userProfile.name} (${userProfile.mode})`;
      document.getElementById('user-avatar-initial').innerText = userProfile.name.charAt(0).toUpperCase();
      document.getElementById('water-val').innerText = `${waterIntake.toFixed(2)} / ${waterGoal} L`;
      document.getElementById('streak-count').innerText = `${streakDays} Days`;
    }

    function addWater(amountL, event) {
      if (event) event.stopPropagation();
      waterIntake = Math.min(waterIntake + amountL, 5.0);
      updateProfileUI();
      showToast(`💧 Added +${amountL * 1000}ml Water!`);
    }

    // Switch Goal (Cut, Recomp, Bulk)
    function setGoal(goalKey) {
      currentGoalKey = goalKey;
      
      // Toggle button styles
      document.querySelectorAll('.goal-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${goalKey}`).classList.add('active');

      const presets = getGoalPresets(userProfile.weight);
      showToast(`Switched to ${presets[goalKey].name}`);
      updateUI();
    }

    function updateUI() {
      const presets = getGoalPresets(userProfile.weight);
      const target = presets[currentGoalKey];

      // Calculate totals
      const totals = foodLog.reduce((acc, curr) => {
        acc.calories += curr.calories;
        acc.protein += curr.protein;
        acc.carbs += curr.carbs;
        acc.fat += curr.fat;
        return acc;
      }, { calories: 0, protein: 0, carbs: 0, fat: 0 });

      // Calculate Remainings
      const remCal = target.calories - totals.calories;
      const remP = target.protein - totals.protein;
      const remC = target.carbs - totals.carbs;
      const remF = target.fat - totals.fat;

      // Update Header Badge & Targets
      document.getElementById('goal-badge').innerText = `${target.name} • ${target.calories.toLocaleString()} KCAL`;
      document.getElementById('cal-target').innerText = target.calories.toLocaleString();
      document.getElementById('cal-consumed').innerText = totals.calories.toLocaleString();
      
      // Dynamic color for remaining calories if exceeded
      const remCalEl = document.getElementById('cal-remaining');
      remCalEl.innerText = remCal.toLocaleString();
      if (remCal < 0) {
        remCalEl.style.color = '#EF4444';
      } else {
        remCalEl.style.color = 'var(--text-main)';
      }

      // Update SVG Progress Ring
      const ringPct = Math.min(Math.max(totals.calories / target.calories, 0), 1);
      const circumference = 326.7; // 2 * PI * 52
      const offset = circumference - (ringPct * circumference);
      document.getElementById('cal-ring').style.strokeDashoffset = offset;
      document.getElementById('cal-percent').innerText = `${Math.round(ringPct * 100)}%`;

      // Update Protein Bar
      updateMacroBar('p', totals.protein, target.protein, remP);
      // Update Carbs Bar
      updateMacroBar('c', totals.carbs, target.carbs, remC);
      // Update Fat Bar
      updateMacroBar('f', totals.fat, target.fat, remF);

      // Render Log List Cards
      renderLogList();
    }

    function updateMacroBar(prefix, eaten, target, remaining) {
      const bar = document.getElementById(`${prefix}-bar`);
      const eatenEl = document.getElementById(`${prefix}-eaten`);
      const targetEl = document.getElementById(`${prefix}-target`);
      const remEl = document.getElementById(`${prefix}-rem`);

      const pct = Math.min(Math.max((eaten / target) * 100, 0), 100);
      bar.style.width = `${pct}%`;

      eatenEl.innerText = `${eaten}g`;
      targetEl.innerText = `${target}g`;

      if (remaining < 0) {
        remEl.innerText = `${Math.abs(remaining)}g over`;
        remEl.style.color = '#EF4444';
      } else {
        remEl.innerText = `${remaining}g left`;
        remEl.style.color = '';
      }
    }

    function renderLogList() {
      const listContainer = document.getElementById('log-list');

      if (foodLog.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            No meals logged today yet.<br>Tap a quick-log item above!
          </div>
        `;
        return;
      }

      listContainer.innerHTML = foodLog.map(item => `
        <div class="log-item">
          <div class="log-info">
            <div class="log-title">${item.icon} ${escapeHtml(item.name)}</div>
            <div class="log-meta">
              <span>${item.time}</span> • 
              <span>${item.protein}g P</span> • 
              <span>${item.carbs}g C</span> • 
              <span>${item.fat}g F</span>
            </div>
          </div>
          <div class="log-right">
            <span class="log-cal">+${item.calories}</span>
            <button class="del-btn" onclick="deleteLog(${item.id})" title="Remove item">&times;</button>
          </div>
        </div>
      `).join('');
    }

    // Helper for Toast notification
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.querySelector('span').innerText = msg;
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    // XSS Sanitizer helper
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
